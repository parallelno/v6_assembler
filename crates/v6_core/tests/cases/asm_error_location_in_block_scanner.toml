# A typo inside a .pack block body ('.ENDNPACK' instead of '.endpack') used to
# produce 'Unknown directive: .ENDNPACK' without any file/line location.
# This test verifies the error message includes the correct line number.

[files]
"main.asm" = '''
.org $100
.pack
buf:
    .storage 16
.ENDNPACK
'''

[expect]
error_contains = "Unknown directive"
error_line = 5
